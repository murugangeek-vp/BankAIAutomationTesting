version: '3.8'

services:
  bankai-orchestrator:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - BANKAI_ENV=test
    volumes:
      - ./evidence_store:/app/evidence_store
      - ./reports:/app/reports
      - ./checkpoints:/app/checkpoints

  bankai-dashboard:
    build: .
    command: python src/dashboard/server.py
    ports:
      - "8081:8080"
