name: BankAI Automation CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Nightly exploratory bug hunter run at 2 AM UTC

jobs:
  smoke-test:
    name: Deterministic Smoke Suite (< 10 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Synthetic Data & Validator Tests
        run: |
          pytest tests/test_synthetic_data.py -v

      - name: Run MCP Gateway & PII Redaction Tests
        run: |
          pytest tests/test_mcp_gateway.py -v

  multi-agent-regression:
    name: Multi-Agent Regression & Oracle Verification
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Full Multi-Agent Suite
        run: |
          pytest tests/ -v
